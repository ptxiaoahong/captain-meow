<!-- Root element of PhotoSwipe. Must have class pswp. -->
<div class="pswp" tabindex="-1" role="dialog" aria-hidden="true">

    <!-- Background of PhotoSwipe. 
         It's a separate element as animating opacity is faster than rgba(). -->
    <div class="pswp__bg"></div>

    <!-- Slides wrapper with overflow:hidden. -->
    <div class="pswp__scroll-wrap">

        <!-- Container that holds slides. 
            PhotoSwipe keeps only 3 of them in the DOM to save memory.
            Don't modify these 3 pswp__item elements, data is added later on. -->
        <div class="pswp__container">
            <div class="pswp__item"></div>
            <div class="pswp__item"></div>
            <div class="pswp__item"></div>
        </div>

        <!-- Default (PhotoSwipeUI_Default) interface on top of sliding area. Can be changed. -->
        <div class="pswp__ui pswp__ui--hidden">

            <div class="pswp__top-bar">

                <!--  Controls are self-explanatory. Order can be changed. -->

                <div class="pswp__counter"></div>

                <button class="pswp__button pswp__button--close" title="Close (Esc)"></button>

                <button class="pswp__button pswp__button--share" title="Share"></button>

                <button class="pswp__button pswp__button--fs" title="Toggle fullscreen"></button>

                <button class="pswp__button pswp__button--zoom" title="Zoom in/out"></button>

                <!-- Preloader demo https://codepen.io/dimsemenov/pen/yyBWoR -->
                <!-- element will get class pswp__preloader--active when preloader is running -->
                <div class="pswp__preloader">
                    <div class="pswp__preloader__icn">
                        <div class="pswp__preloader__cut">
                            <div class="pswp__preloader__donut"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="pswp__share-modal pswp__share-modal--hidden pswp__single-tap">
                <div class="pswp__share-tooltip"></div>
            </div>

            <button class="pswp__button pswp__button--arrow--left" title="Previous (arrow left)">
            </button>

            <button class="pswp__button pswp__button--arrow--right" title="Next (arrow right)">
            </button>

            <div class="pswp__caption">
                <div class="pswp__caption__center"></div>
            </div>

        </div>

    </div>

</div>

<!-- PhotoSwipe 图片画廊脚本 - 等待 StackGallery 完成后再初始化 -->
<script>
(function() {
    'use strict';
    
    const startTime = Date.now();
    
    function waitForStackGallery() {
        const articleContent = document.querySelector('.article-content');
        if (!articleContent) {
            setTimeout(waitForStackGallery, 100);
            return;
        }
        
        // 检查是否有图片（无论是否被包装）
        const figures = articleContent.querySelectorAll('figure.gallery-image');
        const images = articleContent.querySelectorAll('img.gallery-image');
        
        // 如果既没有 figure 也没有 img，说明可能图片还没加载，继续等待
        if (figures.length === 0 && images.length === 0) {
            // 最多等待 3 秒
            if (Date.now() - startTime > 3000) {
                console.log('No gallery images found after 3 seconds');
                return;
            }
            setTimeout(waitForStackGallery, 200);
            return;
        }
        
        // 如果只有 img 没有 figure，再等待一下让 StackGallery 完成
        if (images.length > 0 && figures.length === 0) {
            // 最多等待 1.5 秒让 StackGallery 完成
            if (Date.now() - startTime > 1500) {
                // StackGallery 可能没有包装这些图片，直接处理
                console.log('StackGallery may not have wrapped images, processing directly...');
                initPhotoSwipe();
            } else {
                setTimeout(waitForStackGallery, 100);
            }
            return;
        }
        
        // 有图片了，初始化 PhotoSwipe
        initPhotoSwipe();
    }
    
    function initPhotoSwipe() {
        // 检查必要的库是否已加载
        if (!window.PhotoSwipe || !window.PhotoSwipeUI_Default) {
            console.log('PhotoSwipe not loaded yet, waiting...');
            setTimeout(initPhotoSwipe, 200);
            return;
        }
        
        const articleContent = document.querySelector('.article-content');
        if (!articleContent) {
            console.log('Article content not found');
            return;
        }
        
        // 查找所有画廊图片（优先查找 figure，如果没有则查找 img）
        let figures = articleContent.querySelectorAll('figure.gallery-image');
        let images = [];
        
        // 总是查找所有 img.gallery-image，包括那些可能还没被包装的
        images = Array.from(articleContent.querySelectorAll('img.gallery-image'));
        
        // 过滤掉已经被包装在 figure 中的图片
        images = images.filter(img => !img.closest('figure.gallery-image'));
        
        const totalItems = figures.length + images.length;
        if (totalItems === 0) {
            console.log('No gallery images found');
            return;
        }
        
        console.log(`Found ${figures.length} figures and ${images.length} unwrapped images, initializing PhotoSwipe...`);
        
        // 构建 PhotoSwipe 项目数组
        const items = [];
        const elements = [];
        
        // 获取图片真实尺寸的辅助函数（同步版本）
        function getImageSize(img) {
            // 优先从 HTML 属性获取（这些是 Hugo 渲染时设置的原始尺寸）
            const widthAttr = parseInt(img.getAttribute('width'));
            const heightAttr = parseInt(img.getAttribute('height'));
            
            if (widthAttr && heightAttr) {
                return {
                    width: widthAttr,
                    height: heightAttr
                };
            }
            
            // 如果图片已加载，使用 naturalWidth/naturalHeight
            if (img.complete && img.naturalWidth > 0 && img.naturalHeight > 0) {
                return {
                    width: img.naturalWidth,
                    height: img.naturalHeight
                };
            }
            
            // 如果都获取不到，从 srcset 或使用默认值
            // 尝试从 srcset 解析尺寸提示
            const srcset = img.getAttribute('srcset');
            if (srcset) {
                // 简单解析，假设最大尺寸在最后
                const matches = srcset.match(/(\d+)w/);
                if (matches) {
                    const maxWidth = parseInt(matches[1]);
                    // 假设宽高比，使用默认比例
                    return {
                        width: maxWidth,
                        height: Math.round(maxWidth * 0.75) // 假设 4:3 比例
                    };
                }
            }
            
            // 最后使用默认值
            return {
                width: widthAttr || 1200,
                height: heightAttr || 800
            };
        }
        
        // 处理 figure 元素
        figures.forEach((figure) => {
            const link = figure.querySelector('a');
            const img = figure.querySelector('img');
            
            if (!img) return;
            
            const imageSrc = link ? link.getAttribute('href') : img.src;
            const figcaption = figure.querySelector('figcaption');
            const title = figcaption ? figcaption.textContent.trim() : '';
            
            // 获取图片尺寸
            const size = getImageSize(img);
            
            items.push({
                src: imageSrc,
                w: size.width,
                h: size.height,
                title: title,
                msrc: img.src,
                el: figure
            });
            
            elements.push({ element: figure, link: link, img: img });
        });
        
        // 处理未被包装的 img 元素
        images.forEach((img) => {
            // 跳过已经被包装在 figure 中的图片
            if (img.closest('figure.gallery-image')) return;
            
            const alt = img.getAttribute('alt') || '';
            
            // 获取图片尺寸
            const size = getImageSize(img);
            
            items.push({
                src: img.src,
                w: size.width,
                h: size.height,
                title: alt,
                msrc: img.src,
                el: img
            });
            
            elements.push({ element: img, link: null, img: img });
        });
        
        // 绑定点击事件 - 使用 capture 阶段确保优先执行
        elements.forEach((item, index) => {
            const { element, link, img } = item;
            
            // 如果有链接，处理链接
            if (link) {
                link.removeAttribute('target');
                
                // 移除所有现有的事件监听器（通过克隆节点）
                const newLink = link.cloneNode(true);
                link.parentNode.replaceChild(newLink, link);
                
                // 使用 capture 阶段确保我们的处理优先执行，覆盖 StackGallery 的事件
                newLink.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    e.stopImmediatePropagation();
                    openGallery(index);
                    return false;
                }, true); // capture = true，确保优先执行
            } else {
                // 如果没有链接，直接在图片上绑定
                img.style.cursor = 'pointer';
                
                // 移除可能存在的旧事件监听器
                const newImg = img.cloneNode(true);
                img.parentNode.replaceChild(newImg, img);
                
                // 使用 capture 阶段确保我们的处理优先执行
                newImg.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    e.stopImmediatePropagation();
                    openGallery(index);
                    return false;
                }, true); // capture = true，确保优先执行
            }
        });
        
        function openGallery(index) {
            const pswpElement = document.querySelector('.pswp');
            if (!pswpElement) {
                console.error('PhotoSwipe element (.pswp) not found');
                return;
            }
            
            const options = {
                index: index,
                bgOpacity: 0.85,
                showHideOpacity: true,
                loop: true,
                pinchToClose: true,
                closeOnScroll: false,
                closeOnVerticalDrag: true,
                mouseUsed: false,
                escKey: true,
                arrowKeys: true,
                history: false,
                allowUpscale: false, // 不允许放大超出原始尺寸
                maxSpreadZoom: 3, // 最大缩放倍数
                getThumbBoundsFn: function(idx) {
                    const item = items[idx];
                    if (!item || !item.el) return null;
                    
                    // 如果 el 是 figure，查找其中的 img；否则 el 就是 img
                    const img = item.el.tagName === 'FIGURE' 
                        ? item.el.querySelector('img') 
                        : item.el;
                    
                    if (!img) return null;
                    
                    const pageYScroll = window.pageYOffset || document.documentElement.scrollTop;
                    const rect = img.getBoundingClientRect();
                    
                    return {
                        x: rect.left,
                        y: rect.top + pageYScroll,
                        w: rect.width
                    };
                }
            };
            
            const gallery = new window.PhotoSwipe(pswpElement, window.PhotoSwipeUI_Default, items, options);
            gallery.init();
            
            console.log('PhotoSwipe gallery opened at index:', index);
        }
        
        console.log('PhotoSwipe initialized successfully');
    }
    
    // 在不同时机尝试初始化
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(waitForStackGallery, 500);
        });
    } else {
        setTimeout(waitForStackGallery, 500);
    }
    
    // 页面完全加载后再次尝试
    window.addEventListener('load', function() {
        setTimeout(waitForStackGallery, 800);
    });
})();
</script>
