{{/* 文章详情页返回按钮 - 点击返回文章列表并恢复滚动位置 */}}
<button id="back-to-list" class="back-to-list" aria-label="返回列表" title="返回列表">
    <svg class="back-to-list-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
</button>

<script>
(function() {
    // 返回列表功能
    const backToListBtn = document.getElementById('back-to-list');
    if (!backToListBtn) return;
    
    backToListBtn.addEventListener('click', function(e) {
        e.preventDefault();
        
        // 检查是否有历史记录可以返回
        if (window.history.length > 1 && document.referrer) {
            // 尝试返回上一页
            window.history.back();
        } else {
            // 没有历史记录，返回首页
            window.location.href = '/';
        }
    });
})();
</script>
