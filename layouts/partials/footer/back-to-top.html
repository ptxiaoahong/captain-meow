<style>
#back-to-top, #scroll-to-comments {
    position: fixed;
    right: 30px;
    width: 48px;
    height: 48px;
    background-color: var(--color-surface, #ffffff);
    border: 1px solid var(--color-border, #e8e4dd);
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transform: translateY(20px);
    transition: opacity 0.3s ease, visibility 0.3s ease, transform 0.3s ease;
    z-index: 1000;
    padding: 0;
    box-shadow: var(--shadow-1, 0 1px 3px rgba(0,0,0,0.05));
}
#back-to-top {
    bottom: 30px;
}
#scroll-to-comments {
    bottom: 90px;
}
#back-to-top.visible, #scroll-to-comments.visible {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}
#back-to-top:hover, #scroll-to-comments:hover {
    background-color: var(--color-bg, #faf9f7);
    box-shadow: var(--shadow-2, 0 4px 16px rgba(0,0,0,0.07));
}
#back-to-top .back-to-top-icon,
#scroll-to-comments .scroll-to-comments-icon {
    width: 20px;
    height: 20px;
    color: var(--color-text-secondary, #6e6a64);
    transition: color 0.3s ease;
}
#back-to-top .back-to-top-progress {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
    z-index: 1;
    pointer-events: none;
}
#back-to-top .back-to-top-progress circle {
    stroke: #b9b4ac;
    stroke-width: 2.5;
    stroke-linecap: round;
    fill: none;
    transition: stroke-dashoffset 0.1s linear, stroke 0.3s ease;
}
#back-to-top .back-to-top-icon {
    position: relative;
    z-index: 2;
}
@media (max-width: 767px) {
    #back-to-top {
        bottom: 20px;
        right: 20px;
        width: 44px;
        height: 44px;
    }
    #scroll-to-comments {
        bottom: 76px;
        right: 20px;
        width: 44px;
        height: 44px;
    }
}
</style>
<!-- 回到顶部按钮 -->
<button id="back-to-top" class="back-to-top" aria-label="回到顶部">
    <svg class="back-to-top-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 19V5M12 5L5 12M12 5L19 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <svg class="back-to-top-progress" viewBox="0 0 24 24">
        <circle class="back-to-top-progress-circle" cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
    </svg>
</button>

<!-- 跳转评论区按钮 -->
<button id="scroll-to-comments" class="scroll-to-comments" aria-label="跳转评论区">
    <svg class="scroll-to-comments-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
</button>

<script>
(function() {
    'use strict';
    
    const backToTopBtn = document.getElementById('back-to-top');
    const progressCircle = backToTopBtn.querySelector('.back-to-top-progress-circle');
    const scrollToCommentsBtn = document.getElementById('scroll-to-comments');
    
    if (!backToTopBtn || !progressCircle) return;
    
    // 计算滚动进度
    function updateProgress() {
        const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
        const docHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        const scrollPercent = docHeight > 0 ? (scrollTop / docHeight) : 0;
        
        // 更新进度条（使用 stroke-dasharray 和 stroke-dashoffset）
        const circumference = 2 * Math.PI * 10; // r = 10
        const offset = circumference * (1 - scrollPercent);
        
        progressCircle.style.strokeDasharray = circumference;
        progressCircle.style.strokeDashoffset = offset;
        
        // 显示/隐藏按钮（滚动超过 300px 时显示）
        if (scrollTop > 300) {
            backToTopBtn.classList.add('visible');
            if (scrollToCommentsBtn) {
                scrollToCommentsBtn.classList.add('visible');
            }
        } else {
            backToTopBtn.classList.remove('visible');
            if (scrollToCommentsBtn) {
                scrollToCommentsBtn.classList.remove('visible');
            }
        }
    }
    
    // 回到顶部
    function scrollToTop() {
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    }
    
    // 跳转到评论区
    function scrollToComments() {
        const commentSection = document.getElementById('waline');
        if (commentSection) {
            const offset = 80; // 偏移量，避免被固定导航栏遮挡
            const elementPosition = commentSection.getBoundingClientRect().top;
            const offsetPosition = elementPosition + window.pageYOffset - offset;
            
            window.scrollTo({
                top: offsetPosition,
                behavior: 'smooth'
            });
        }
    }
    
    // 绑定事件
    backToTopBtn.addEventListener('click', scrollToTop);
    if (scrollToCommentsBtn) {
        scrollToCommentsBtn.addEventListener('click', scrollToComments);
    }
    window.addEventListener('scroll', updateProgress);
    window.addEventListener('resize', updateProgress);
    
    // 初始化
    updateProgress();
})();
</script>
