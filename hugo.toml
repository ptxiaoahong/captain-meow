baseURL = 'https://example.org/'
languageCode = "zh-CN"
languageName = "简体中文"
hasCJKLanguage = true
title = "猫猫船长"
theme = 'hugo-theme-stack'
defaultContentLanguage = "zh-cn"

# 增加模板超时时间（处理大量图片时需要）
timeout = 300

# 分页配置
[pagination]
  pagerSize = 10

# 永久链接配置
[permalinks]
  posts = "/posts/:slug/"

# 菜单配置
[menu]
  # 主菜单
  [[menu.main]]
    identifier = "home"
    name = "首页"
    url = "/"
    weight = 1
  
  [[menu.main]]
    identifier = "posts"
    name = "全部"
    url = "/posts/"
    weight = 2

  [[menu.main]]
    identifier = "works"
    name = "作品"
    url = "/categories/作品/"
    weight = 3

  [[menu.main]]
    identifier = "memories"
    name = "回忆"
    url = "/categories/回忆/"
    weight = 4

  [[menu.main]]
    identifier = "thoughts"
    name = "心里话"
    url = "/categories/心里话/"
    weight = 5

  # 社交链接
  
  [[menu.social]]
    identifier = "wechat"
    name = "微信"
    url = "/wechat-qrcode.png"
    params = { icon = "brand-wechat", qrcode = true }

  [[menu.social]]
    identifier = "email"
    name = "Email"
    url = "mailto:hongshize@live.cn"
    params = { icon = "mail" }

# 服务配置
[services]
  [services.googleAnalytics]
    id = "G-8L5LC1T72B"

# 主题参数配置
[params]
  mainSections = ["posts"]
  featuredImageField = "image"
  rssFullContent = true

  # 页脚配置
  [params.footer]
    since = 2025
    customText = ""

  # 日期格式
  [params.dateFormat]
    published = "2006-01-02"
    lastUpdated = "2006-01-02 15:04"

  # 侧边栏配置
  [params.sidebar]
    emoji = ""
    subtitle = "这里是猫猫船长的个人网站，分享摄影回忆与作品，说说心里话，小红书id'猫猫船长'，微信1176670966，欢迎来找我玩！"
    [params.sidebar.avatar]
      enabled = true
      local = true
      src = "img/avatar.jpg"

  # 文章配置
  [params.article]
    math = false
    toc = true
    readingTime = true
    [params.article.license]
      enabled = false
      default = ""

  # 评论配置 - 使用 Valine（Waline 兼容 Valine API）
  [params.comments]
    enabled = true
    provider = "waline"

    [params.comments.waline]
      serverURL = "https://waline-iota-beryl.vercel.app"
      lang = "zh-CN"
      visitor = true
      avatar = "hide"
      emoji = ["https://cdn.jsdelivr.net/gh/walinejs/emojis@1.0.1/weibo"]
      requiredMeta = ["nick", "mail"]
      locale = { admin = "管理员", placeholder = "说点什么吧~" }

  # 小部件配置（已禁用右侧栏）
  [params.widgets]
    homepage = []
    page = []

  # OpenGraph 配置
  [params.opengraph]
    [params.opengraph.twitter]
      card = "summary_large_image"

  # 默认图片配置
  [params.defaultImage]
    [params.defaultImage.opengraph]
      enabled = false
      local = false
      src = ""

  # 颜色方案
  [params.colorScheme]
    toggle = true
    default = "auto"

  # 图片处理
  [params.imageProcessing]
    [params.imageProcessing.cover]
      enabled = true
    [params.imageProcessing.content]
      enabled = false  # 禁用内容图片压缩，使用原始尺寸

# 图片压缩配置 - 限制每张图片不超过 1MB
[imaging]
  quality = 70
  resampleFilter = "CatmullRom"
  anchor = "Center"

# 相关文章配置
[related]
  includeNewer = true
  threshold = 60
  toLower = false
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 200

# Markup 配置
[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = false
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    endLevel = 4
    ordered = true
    startLevel = 2
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNoStart = 1
    lineNos = true
    lineNumbersInTable = true
    tabWidth = 4
