{{- if .Site.Params.page.comment.enable -}}
  {{- if .Site.Params.page.comment.valine.enable -}}
    <div id="vcomments-container">
      <div id="vcomments"></div>
      <script>
        // 调试信息
        console.log('[Valine] 初始化配置:', {
          appId: '{{ .Site.Params.page.comment.valine.appId }}',
          serverURLs: '{{ .Site.Params.page.comment.valine.serverURLs }}'
        });
        
        // 加载Valine核心JS
        function loadValine() {
          const script = document.createElement('script');
          script.src = 'https://cdn.jsdelivr.net/npm/valine@1.5/dist/Valine.min.js';
          script.onload = function() {
            new Valine({
              el: '#vcomments',
              appId: '{{ .Site.Params.page.comment.valine.appId }}',
              appKey: '{{ .Site.Params.page.comment.valine.appKey }}',
              placeholder: '{{ .Site.Params.page.comment.valine.placeholder }}',
              avatar: '{{ .Site.Params.page.comment.valine.avatar }}',
              meta: {{ .Site.Params.page.comment.valine.meta }},
              pageSize: {{ .Site.Params.page.comment.valine.pageSize }},
              lang: '{{ .Site.Params.page.comment.valine.lang }}',
              visitor: {{ .Site.Params.page.comment.valine.visitor }},
              recordIP: {{ .Site.Params.page.comment.valine.recordIP }},
              highlight: {{ .Site.Params.page.comment.valine.highlight }},
              enableQQ: {{ .Site.Params.page.comment.valine.enableQQ }},
              {{ with .Site.Params.page.comment.valine.serverURLs }}
              serverURLs: '{{ . }}',
              {{ end }}
              emojiCDN: '{{ "/lib/valine/emoji/" | relURL }}',
              emojiMaps: {{ dict "google" "google.yml" "apple" "apple.yml" }}
            });
          };
          document.body.appendChild(script);
        }
        
        // 确保页面完全加载后初始化
        if (document.readyState === 'complete') {
          loadValine();
        } else {
          window.addEventListener('load', loadValine);
        }
      </script>
      <noscript>请启用JavaScript查看评论</noscript>
    </div>
  {{- end -}}
{{- end -}}
