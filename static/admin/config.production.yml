# 生产环境配置文件
# 部署前，将 config.yml 中的 backend.name 改为 git-gateway
# 并将此文件重命名为 config.yml（或手动修改 config.yml）

backend:
  name: git-gateway
  branch: main

media_folder: "static"
public_folder: ""
locale: "zh-cn"

collections:
  - name: "posts"
    label: "文章"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "toml-frontmatter"
    frontmatter_delimiter: "+++"
    
    fields:
      - {label: "标题", name: "title", widget: "string"}
      - {
          label: "发布日期",
          name: "date",
          widget: "datetime",
          format: "YYYY-MM-DDTHH:mm:ssZ",
          default: "now"
        }
      - {label: "草稿", name: "draft", widget: "boolean", default: false}
      - {
          label: "标签",
          name: "tags",
          widget: "select",
          multiple: true,
          options: [
            "作品",
            "文章",
            "回忆",
            "心里话",
            "文艺",
            "清新",
            "电影感",
            "日系",
            "小清新",
            "法式",
            "暗黑",
            "情绪",
            "抽象",
            "大海",
            "糖水",
            "职业生涯",
            "自我",
            "CNU编辑精选",
            "CNU最热",
            "故事感",
            "夏天"
          ]
        }
      - {
          label: "分类",
          name: "categories",
          widget: "select",
          multiple: true,
          options: ["作品", "回忆", "心里话"]
        }
      - {
          label: "预览图片",
          name: "featuredImagePreview",
          widget: "string",
          required: false,
          hint: "图片路径，如: /2/文件1.jpg"
        }
      - {label: "启用评论", name: "comment", widget: "boolean", default: true}
      - {
          label: "正文",
          name: "body",
          widget: "markdown",
          hint: "摄影作品集：直接写图片路径，如 ![](/2/文件1.jpg)\n文字文章：正常写文字和图片"
        }

